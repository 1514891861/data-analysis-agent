# ============================================================
# 数据分析 Agent — 双容器部署（可移植版：不含任何本机专属路径）
#   backend  : FastAPI 工作流服务 (8001)
#   frontend : Streamlit 界面      (8501)
# 容器间通过服务名互访：frontend 用 http://backend:8001
#
# 启动：docker compose up --build -d
# 查看：docker compose logs -f
# 停止：docker compose down
# ============================================================
services:
  backend:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple  # 国内构建加速；海外设备可删掉这个 args 段走官方源
    container_name: agent-backend
    command: uvicorn api:app --host 0.0.0.0 --port 8001
    env_file: .env          # 密钥从宿主机 .env 注入环境变量，不打包进镜像
    volumes:
      # 数据目录：上传文件 + 图表/报告 + 会话数据库（都在 data/ 里，容器删了数据仍在宿主机）
      - ./data:/app/data
      # HuggingFace 模型缓存：优先读 .env 里的 HF_CACHE_PATH（复用已下载的 BGE-M3）；
      # 没设置就用项目下的 ./hf_cache 文件夹（新设备自动创建，首次分析时下载模型 ~2GB）
      - ${HF_CACHE_PATH:-./hf_cache}:/root/.cache/huggingface
    ports:
      - "8001:8001"         # 方便直接访问 /docs 调试
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: agent-frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      # 关键：前端容器访问后端走 compose 网络的服务名，不是 localhost
      BACKEND_URL: http://backend:8001
    depends_on:
      - backend
    ports:
      - "8501:8501"
    restart: unless-stopped
